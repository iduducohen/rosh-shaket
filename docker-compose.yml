services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rosh_shaket
      POSTGRES_USER: rosh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rosh_dev_password}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rosh -d rosh_shaket"]
      interval: 5s
      retries: 10

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: rosh_shaket
    ports: ["27017:27017"]
    volumes:
      - mongodata:/data/db
      - ./server/db/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./server
    ports: ["5080:8080"]
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=rosh_shaket;Username=rosh;Password=${POSTGRES_PASSWORD:-rosh_dev_password}
      ConnectionStrings__Mongo: mongodb://mongo:27017
      ConnectionStrings__Redis: redis:6379
      Claude__ApiKey: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  mongodata:
