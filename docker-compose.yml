services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rosh_shaket
      POSTGRES_USER: rosh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rosh_dev_password}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rosh -d rosh_shaket"]
      interval: 5s
      retries: 10

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: rosh_shaket
    ports: ["27017:27017"]
    volumes:
      - mongodata:/data/db
      - ./server/db/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports: ["5080:8080"]
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=rosh_shaket;Username=rosh;Password=${POSTGRES_PASSWORD:-rosh_dev_password}
      ConnectionStrings__Mongo: mongodb://mongo:27017
      ConnectionStrings__Redis: redis:6379
      Claude__ApiKey: ${ANTHROPIC_API_KEY:-}
      # Prefer Authentication__* (same as User Secrets). Legacy Auth__* still binds if set.
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Authentication__Google__IosClientId: ${GOOGLE_IOS_CLIENT_ID:-}
      Authentication__Apple__ClientId: ${APPLE_SERVICES_ID:-}
      Authentication__Apple__BundleId: il.roshshaket.app
      Authentication__Microsoft__ClientId: ${MICROSOFT_CLIENT_ID:-}
      Authentication__Microsoft__TenantId: ${MICROSOFT_TENANT_ID:-common}
      Authentication__Smtp__Host: ${SMTP_HOST:-}
      Authentication__Smtp__User: ${SMTP_USER:-}
      Authentication__Smtp__Password: ${SMTP_PASSWORD:-}
      Authentication__Smtp__From: ${SMTP_FROM:-}
      Authentication__RedirectOrigin: ${AUTH_REDIRECT_ORIGIN:-http://localhost:5051}
      Authentication__Otp__Pepper: ${AUTH_OTP_PEPPER:-dev-insecure-otp-pepper-change-me}
      FileStorage__LocalRoot: /data/documents
    volumes:
      - docstore:/data/documents
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  mongodata:
  docstore:
