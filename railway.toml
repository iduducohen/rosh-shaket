# .NET API — Dockerfile at repo root so Railway does not fall back to Railpack.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["server/**", "Dockerfile", "railway.toml", "railway.json"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
