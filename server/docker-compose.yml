services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: rosh-shaket-api
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Cors__Origins__0: http://localhost:5051
      Cors__Origins__1: http://127.0.0.1:5051
      Claude__ApiKey: ${Claude__ApiKey:-${ANTHROPIC_API_KEY:-}}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=rosh_shaket;Username=rosh;Password=rosh_dev_password
      ConnectionStrings__Mongo: mongodb://mongo:27017
      ConnectionStrings__Redis: redis:6379
      Mongo__Database: rosh_shaket
      FileStorage__LocalRoot: /data/documents
      DataProtection__KeysPath: /keys
      # Auth — from server/.env or repo-root .env (see .env.example)
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-${Authentication__Google__ClientId:-}}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-${Authentication__Google__ClientSecret:-}}
      Authentication__Google__IosClientId: ${GOOGLE_IOS_CLIENT_ID:-${Authentication__Google__IosClientId:-}}
      Authentication__Apple__ClientId: ${APPLE_SERVICES_ID:-${Authentication__Apple__ClientId:-}}
      Authentication__Microsoft__ClientId: ${MICROSOFT_CLIENT_ID:-${Authentication__Microsoft__ClientId:-}}
      Authentication__Microsoft__TenantId: ${MICROSOFT_TENANT_ID:-common}
      Authentication__RedirectOrigin: ${AUTH_REDIRECT_ORIGIN:-http://localhost:5051}
      Authentication__Otp__Pepper: ${AUTH_OTP_PEPPER:-dev-insecure-otp-pepper-change-me}
      Authentication__Smtp__Host: ${SMTP_HOST:-}
      Authentication__Smtp__Port: ${SMTP_PORT:-587}
      Authentication__Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Authentication__Smtp__User: ${SMTP_USER:-}
      Authentication__Smtp__Password: ${SMTP_PASSWORD:-}
      Authentication__Smtp__From: ${SMTP_FROM:-}
    env_file:
      - path: .env
        required: false
      - path: ../.env
        required: false
    volumes:
      - dpkeys:/keys
      - docstore:/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    # Local inspection (DBeaver): localhost:5433 — 5432 is often taken by other projects.
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: rosh_shaket
      POSTGRES_USER: rosh
      POSTGRES_PASSWORD: rosh_dev_password
    volumes:
      - rosh_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rosh -d rosh_shaket"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mongo:
    image: mongo:7
    # Local inspection (MongoDB Compass): mongodb://localhost:27018
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - rosh_mongo:/data/db
      - ./db/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  rosh_pg:
  rosh_mongo:
  dpkeys:
  docstore:
