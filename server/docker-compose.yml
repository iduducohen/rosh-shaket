services:
  api:
    build: .
    image: rosh-shaket-api
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Cors__Origins__0: http://localhost:5051
      Cors__Origins__1: http://127.0.0.1:5051
      Claude__ApiKey: ${Claude__ApiKey}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=rosh_shaket;Username=rosh;Password=rosh_dev_password
      ConnectionStrings__Mongo: mongodb://mongo:27017
      ConnectionStrings__Redis: redis:6379
      Mongo__Database: rosh_shaket
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rosh_shaket
      POSTGRES_USER: rosh
      POSTGRES_PASSWORD: rosh_dev_password
    volumes:
      - rosh_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rosh -d rosh_shaket"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - rosh_mongo:/data/db
      - ./db/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  rosh_pg:
  rosh_mongo:
